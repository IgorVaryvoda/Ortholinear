name: Ortholinear
options:
  bundleIdPrefix: com.varyvoda
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2Z5ZVRKA23
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    ORTHOLINEAR_APP_GROUP: group.com.varyvoda.Ortholinear
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Ortholinear:
    type: application
    platform: iOS
    sources: [App, Core, SharedUI, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varyvoda.Ortholinear
        INFOPLIST_KEY_CFBundleDisplayName: Ortholinear
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record speech you choose to transcribe with Groq using your own API key.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.varyvoda.Ortholinear.voice
            CFBundleURLSchemes: [ortholinear]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrtholinearAppGroup: $(ORTHOLINEAR_APP_GROUP)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Ortholinear.entitlements
      properties:
        com.apple.security.application-groups: [$(ORTHOLINEAR_APP_GROUP)]
    dependencies:
      - target: OrtholinearKeyboard
        embed: true
  OrtholinearKeyboard:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension, Core, SharedUI, Resources/PrivacyInfo.xcprivacy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.varyvoda.Ortholinear.Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Ortholinear
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrtholinearAppGroup: $(ORTHOLINEAR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: uk-UA
            RequestsOpenAccess: false
    entitlements:
      path: KeyboardExtension/OrtholinearKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(ORTHOLINEAR_APP_GROUP)]
  OrtholinearUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ortholinear
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.varyvoda.Ortholinear.UITests
  OrtholinearSystemTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: Ortholinear
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.varyvoda.Ortholinear.SystemTests
schemes:
  Ortholinear:
    build:
      targets:
        Ortholinear: all
    test:
      targets: [OrtholinearUITests]
  OrtholinearSystemTests:
    build:
      targets:
        Ortholinear: all
    test:
      targets: [OrtholinearSystemTests]
